<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesor de Ventas IA - Calyrisia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: #030712; height: 100vh; display: flex; justify-content: center; align-items: center; background-image: radial-gradient(ellipse at 50% 20%, rgba(0, 242, 254, 0.08), transparent 50%); }
        #chat-wrapper { width: 100%; max-width: 440px; height: 90vh; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e4e4e7; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #fafafa; border-bottom: 1px solid #f0f0f0; }
        .top-nav a { text-decoration: none; font-size: 0.82rem; font-weight: 500; }
        .chat-header { background: #ffffff; padding: 16px 20px; text-align: center; border-bottom: 1px solid #f4f4f5; display: flex; flex-direction: column; align-items: center; }
        .chat-header h1 { font-size: 1.15rem; color: #18181b; font-weight: 600; letter-spacing: -0.5px; }
        .status-dot { display: inline-block; width: 6px; height: 6px; background: #10b981; border-radius: 50%; margin-right: 4px; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #fafafa; }
        .msg { padding: 12px 16px; border-radius: 16px; max-width: 88%; font-size: 0.95rem; line-height: 1.45; animation: fadeIn 0.3s ease-out forwards; white-space: pre-line; }
        .user { background: #0f172a; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background: #ffffff; color: #18181b; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f4f4f5; }
        #typing { display: none; align-self: flex-start; background: #ffffff; padding: 10px 16px; border-radius: 16px; border: 1px solid #f4f4f5; gap: 4px; align-items: center; }
        .dot { width: 6px; height: 6px; background: #a1a1aa; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .chat-input-area { padding: 16px 20px; background: #ffffff; border-top: 1px solid #f4f4f5; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px 16px; border: 1px solid #e4e4e7; border-radius: 25px; outline: none; font-size: 0.95rem; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #0284c7; }
        button.btn-send { width: 44px; height: 44px; border-radius: 50%; background: #0f172a; color: #ffffff; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: background 0.2s, transform 0.1s; }
        button.btn-send:hover { background: #1e293b; transform: scale(1.05); }
        button.btn-send:disabled { background: #e4e4e7; cursor: not-allowed; transform: none; }
        
        /* TARJETA DE PAGO INTERACTIVA DEMO */
        .payment-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            margin: 4px 0 8px 0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-self: flex-start;
            width: 100%;
            max-width: 95%;
            animation: fadeIn 0.3s ease-out forwards;
        }
        .pay-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pay-badge {
            font-size: 0.68rem;
            font-weight: 700;
            color: #0284c7;
            background: #e0f2fe;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }
        .pay-amount {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
        }
        .pay-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: #1e293b;
        }
        .pay-info {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.82rem;
            color: #475569;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid #f1f5f9;
        }
        .pay-info-row {
            display: flex;
            justify-content: space-between;
        }
        .pay-status-box {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.84rem;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .pay-status-box.pending {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }
        .pay-status-box.approved {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .pay-status-box.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .hidden { display: none !important; }
        .btn-pay-demo {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }
        .btn-pay-demo:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
        }
        .btn-pay-demo:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .spin { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="chat-wrapper">
        <div class="top-nav">
            <a href="/" style="color: #64748b;">← Inicio</a>
            <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 0.72rem; color: #10b981; display: inline-flex; align-items: center;"><span class="status-dot"></span><span id="status">En línea</span></span>
                <button type="button" onclick="switchTenant()" style="background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 3px 8px; font-size: 0.72rem; color: #475569; cursor: pointer; display: flex; align-items: center; gap: 4px;" title="Cambiar negocio activo">
                    🏢 Cambiar ID
                </button>
                <button type="button" onclick="resetChatSession()" style="background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 3px 8px; font-size: 0.72rem; color: #475569; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                    🔄 Reiniciar
                </button>
            </div>
            <a href="/feedback" style="color: #0284c7; font-weight: 600;">⭐ Feedback</a>
        </div>
        <div class="chat-header">
            <h1 id="business-name">Calyrisia Asesor IA</h1>
            <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; flex-wrap: wrap;">
                <span id="business-type-badge" style="font-size: 0.72rem; color: #0284c7; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">ASESOR DE VENTAS IA</span>
                <span style="font-size: 0.72rem; color: #cbd5e1;">•</span>
                <span id="tenant-pill" style="font-size: 0.7rem; color: #475569; font-family: monospace; background: #f1f5f9; padding: 2px 8px; border-radius: 6px; border: 1px solid #e2e8f0;" title="ID del Negocio">ID: Detectando...</span>
            </div>
        </div>
        <div id="messages">
            <!-- Los mensajes se cargan dinámicamente -->
        </div>
        <div id="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Escribe un mensaje..." autocomplete="off">
            <button class="btn-send" id="send-button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
