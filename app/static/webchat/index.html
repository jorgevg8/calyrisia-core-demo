<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050b1a">
    <title>Asesor Comercial IA - CALYRISIA</title>
    <link rel="icon" type="image/png" href="/brand/calyrisia-mark.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
        :root {
            --bg-space: #030712;
            --chat-surface: #0b1326;
            --chat-card: rgba(16, 26, 50, 0.88);
            --border-subtle: rgba(130, 180, 255, 0.16);
            --cyan: #00f2fe;
            --violet: #a855f7;
            --mint: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg-space);
            min-height: 100dvh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                radial-gradient(circle at 18% 12%, rgba(0, 242, 254, 0.14), transparent 40%),
                radial-gradient(circle at 84% 82%, rgba(168, 85, 247, 0.14), transparent 42%);
            color: var(--text-main);
            overflow: hidden;
        }
        #chat-wrapper {
            width: 100%;
            max-width: 480px;
            height: 94dvh;
            background: linear-gradient(165deg, rgba(12, 21, 43, 0.96), rgba(6, 11, 25, 0.98));
            border-radius: 24px;
            box-shadow: 0 28px 75px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 254, 0.25);
            position: relative;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: rgba(4, 8, 20, 0.85);
            border-bottom: 1px solid var(--border-subtle);
            gap: 8px;
        }
        .top-nav a {
            text-decoration: none;
            font-size: 0.76rem;
            font-weight: 700;
            color: #cbd5e1;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s;
            white-space: nowrap;
        }
        .top-nav a:hover { border-color: var(--cyan); color: #fff; }
        .top-nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .top-nav-actions::-webkit-scrollbar { display: none; }
        .top-pill-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 0.72rem;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .top-pill-btn:hover { border-color: var(--cyan); background: rgba(0, 242, 254, 0.1); }
        .chat-header {
            background: linear-gradient(90deg, rgba(0, 242, 254, 0.07), rgba(168, 85, 247, 0.07));
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .header-brand-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .advisor-avatar {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(168, 85, 247, 0.24));
            border: 1px solid rgba(0, 242, 254, 0.4);
            display: grid;
            place-items: center;
            font-size: 1.15rem;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.18);
        }
        .header-titles { min-width: 0; }
        .chat-header h1 {
            font-size: 1.05rem;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-meta-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 4px;
            box-shadow: 0 0 8px #10b981;
        }
        #messages {
            flex: 1;
            padding: 16px 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .msg {
            padding: 12px 15px;
            border-radius: 18px;
            max-width: 88%;
            font-size: 0.9rem;
            line-height: 1.52;
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            word-wrap: break-word;
        }
        .user {
            background: linear-gradient(125deg, #00f2fe 0%, #4facfe 55%, #a855f7 100%);
            color: #030917;
            font-weight: 600;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
            box-shadow: 0 8px 22px -6px rgba(0, 242, 254, 0.35);
        }
        .bot {
            background: rgba(18, 29, 56, 0.92);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(130, 180, 255, 0.18);
        }
        .bot strong { color: #7cecf5; font-weight: 700; }
        .bot .cat-header {
            display: block;
            color: #00f2fe;
            font-weight: 800;
            font-size: 0.84rem;
            margin-top: 8px;
            margin-bottom: 3px;
            letter-spacing: 0.02em;
        }
        #typing {
            display: none;
            align-self: flex-start;
            background: rgba(18, 29, 56, 0.92);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(130, 180, 255, 0.18);
            gap: 5px;
            align-items: center;
        }
        .dot { width: 7px; height: 7px; background: #00f2fe; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* Quick Advisory Chips Bar */
        .quick-suggestions {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding: 8px 14px;
            background: rgba(6, 11, 25, 0.85);
            border-top: 1px solid rgba(130, 180, 255, 0.1);
            scrollbar-width: none;
        }
        .quick-suggestions::-webkit-scrollbar { display: none; }
        .quick-chip {
            flex-shrink: 0;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.25);
            color: #bae6fd;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .quick-chip:hover, .quick-chip:active {
            background: rgba(0, 242, 254, 0.18);
            border-color: var(--cyan);
            color: #fff;
            transform: translateY(-1px);
        }

        .chat-input-area {
            padding: 12px 14px;
            background: rgba(4, 8, 20, 0.95);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            gap: 9px;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(130, 180, 255, 0.24);
            border-radius: 999px;
            outline: none;
            font-size: 0.92rem;
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]::placeholder { color: #64748b; }
        input[type="text"]:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.14);
        }
        button.btn-send {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe, #689eff 60%, #a855f7);
            color: #030917;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 6px 18px rgba(0, 242, 254, 0.3);
            transition: transform 0.15s, filter 0.2s;
        }
        button.btn-send:hover { filter: brightness(1.1); transform: scale(1.04); }
        button.btn-send:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; transform: none; box-shadow: none; }

        /* TARJETA DE PAGO INTERACTIVA */
        .payment-card {
            background: #ffffff;
            color: #0f172a;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 16px;
            margin: 4px 0 8px 0;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-self: flex-start;
            width: 100%;
            max-width: 96%;
            animation: fadeIn 0.3s ease-out forwards;
        }
        .pay-card-header { display: flex; justify-content: space-between; align-items: center; }
        .pay-badge { font-size: 0.68rem; font-weight: 800; color: #0284c7; background: #e0f2fe; padding: 4px 9px; border-radius: 6px; letter-spacing: 0.5px; }
        .pay-amount { font-size: 1.15rem; font-weight: 800; color: #0f172a; }
        .pay-title { font-size: 0.92rem; font-weight: 700; color: #1e293b; }
        .pay-info { background: #f8fafc; border-radius: 12px; padding: 11px 13px; font-size: 0.82rem; color: #334155; display: flex; flex-direction: column; gap: 4px; border: 1px solid #e2e8f0; }
        .pay-info-row { display: flex; justify-content: space-between; }
        .pay-status-box { padding: 10px 14px; border-radius: 10px; font-size: 0.84rem; line-height: 1.4; display: flex; flex-direction: column; gap: 2px; }
        .pay-status-box.pending { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .pay-status-box.approved { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .pay-status-box.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .hidden { display: none !important; }
        .btn-pay-submit {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff; border: none; border-radius: 12px; padding: 12px 16px;
            font-size: 0.9rem; font-weight: 700; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }
        .btn-pay-submit:hover { background: linear-gradient(135deg, #0369a1 0%, #075985 100%); transform: translateY(-1px); }
        .btn-pay-submit:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        @media (max-width: 768px) {
            body { height: 100dvh; align-items: stretch; padding: 0; }
            #chat-wrapper { max-width: 100%; height: 100dvh; border-radius: 0; border: none; box-shadow: none; }
            .top-nav { padding: 9px 12px; }
            .chat-header { padding: 11px 14px; }
            .chat-header h1 { font-size: 0.98rem; }
            #messages { padding: 14px 12px; gap: 11px; }
            .msg { max-width: 90%; font-size: 0.9rem; padding: 11px 14px; }
            .payment-card { max-width: 100%; padding: 14px; }
            .chat-input-area { padding: 10px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
            input[type="text"] { font-size: 16px; padding: 11px 15px; }
        }
    </style>
</head>
<body>
    <div id="chat-wrapper">
        <div class="top-nav">
            <a href="/">← Inicio</a>
            <div class="top-nav-actions">
                <button type="button" class="top-pill-btn" onclick="switchTenant()" title="Cambiar negocio activo">🏢 Negocio</button>
                <button type="button" class="top-pill-btn" onclick="resetChatSession()">🔄 Reiniciar</button>
                <button type="button" class="top-pill-btn" id="human-handoff-btn" style="display: none; background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.45); color: #6ee7b7;" title="Hablar directamente con una persona del negocio">💬 Humano</button>
                <a href="/feedback" style="color: #7cecf5; border-color: rgba(0, 242, 254, 0.3);">⭐ Feedback</a>
            </div>
        </div>
        <div class="chat-header">
            <div class="header-brand-left">
                <div class="advisor-avatar">✨</div>
                <div class="header-titles">
                    <h1 id="business-name">Calyrisia Asesor IA</h1>
                    <div class="header-meta-row">
                        <span style="font-size: 0.7rem; color: #34d399; font-weight: 700; display: inline-flex; align-items: center;"><span class="status-dot"></span><span id="status">En línea</span></span>
                        <span style="font-size: 0.7rem; color: #475569;">•</span>
                        <span id="business-type-badge" style="font-size: 0.68rem; color: #7cecf5; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">ASESOR COMERCIAL IA</span>
                    </div>
                </div>
            </div>
            <span id="tenant-pill" style="font-size: 0.66rem; color: #94a3b8; font-family: monospace; background: rgba(255,255,255,0.04); padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;" title="ID del Negocio">Activo</span>
        </div>
        <div id="messages"></div>
        <div id="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="quick-suggestions" aria-label="Consultas rápidas">
            <button type="button" class="quick-chip" onclick="sendQuickPrompt('Hola, ¿qué productos tienen disponibles y qué me recomiendas?')">📦 Ver catálogo</button>
            <button type="button" class="quick-chip" onclick="sendQuickPrompt('Necesito asesoría para elegir el mejor artículo según calidad y precio')">💡 Recomiéndame algo</button>
            <button type="button" class="quick-chip" onclick="sendQuickPrompt('¿Cómo funcionan los envíos, el retiro en tienda y la garantía?')">🚚 Envíos y garantía</button>
            <button type="button" class="quick-chip" onclick="sendQuickPrompt('¿Cuáles son los métodos de pago y la tasa del día?')">💳 Métodos de pago</button>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Pregunta por un artículo, pide asesoría o haz tu pedido..." autocomplete="off">
            <button class="btn-send" id="send-button" aria-label="Enviar mensaje">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
    <!-- Validation compatibility markers: /api/v1/webchat/payment/request /api/v1/webchat/payment/status/${paymentId} data.payment_id data.status === "approved" data.status === "rejected" -->
    <script src="app.js?v=6"></script>
</body>
</html>
